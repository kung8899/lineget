<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在同步資料...</title>
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <div id="status" style="text-align: center; margin-top: 50px; font-size: 18px; font-family: sans-serif;">
        系統綁定中，請稍候...
    </div>

    <script>
        // 1. 初始化 LIFF
        liff.init({ liffId: "2012308870-xwtXvPn5" })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login(); // 如果沒登入，跳出登入畫面
                } else {
                    processUserData();
                }
            })
            .catch((err) => {
                document.getElementById('status').innerText = "初始化失敗";
            });

        function processUserData() {
            liff.getProfile()
                .then(profile => {
                    const userId = profile.userId;
                    const userLang = liff.getLanguage(); // 取得語系
                    
                    let langCode = "zh";
                    if (userLang.startsWith("id")) langCode = "id";
                    if (userLang.startsWith("en")) langCode = "en";

                    // 呼叫送出資料的函式
                    saveToGoogleSheet(userId, langCode);
                })
                .catch(err => {
                    document.getElementById('status').innerText = "讀取個人資料失敗";
                });
        }

        function saveToGoogleSheet(userId, langCode) {
            const gasUrl = 'https://google.com';

            // 💡 關鍵：改用網址參數（表單格式）傳送，Google 絕對不會阻擋
            const targetUrl = `${gasUrl}?lineUserId=${encodeURIComponent(userId)}&preferredLanguage=${encodeURIComponent(langCode)}`;

            fetch(targetUrl, {
                method: 'GET', // 改用簡單的 GET 方式傳送
                mode: 'no-cors' // 強制不檢查跨網域
            })
            .then(() => {
                // 只要有送出去，就直接當作成功
                document.getElementById('status').innerText = "資料登記成功！視窗即將關閉。";
                setTimeout(() => {
                    liff.closeWindow(); // 關閉視窗
                }, 1500);
            })
            .catch(err => {
                document.getElementById('status').innerText = "網路連線異常";
            });
        }
    </script>
</body>
</html>
