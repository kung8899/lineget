<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>亞都好友綁定</title>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://line-scdn.net"></script>
</head>
<body>
  <div id="status" style="text-align: center; margin-top: 50px; font-size: 18px; font-family: sans-serif;">
    自動綁定中，請稍候...
  </div>

  <script>
    // 1. 初始化 LIFF
    liff.init({ liffId: "2012308870-xwtXvPn5" })
      .then(() => {
        if (!liff.isLoggedIn()) {
          // 如果沒登入，強制引導登入
          liff.login();
        } else {
          // 已登入，開始取得資料
          processUserData();
        }
      })
      .catch((err) => {
        document.getElementById("status").innerText = "初始化失敗";
        console.error(err);
      });

    // 2. 處理用戶資料
    function processUserData() {
      liff.getProfile()
        .then(profile => {
          const userId = profile.userId;
          const userLang = liff.getLanguage(); // 取得用戶端語系

          // 判斷語系代碼
          let langCode = "zh";
          if (userLang.startsWith("zh")) langCode = "zh";
          if (userLang.startsWith("en")) langCode = "en";

          // 將資料發送至 Google 試算表
          saveToGoogleSheet(userId, langCode);
        })
        .catch(err => {
          document.getElementById("status").innerText = "獲取個人資料失敗";
          console.error(err);
        });
    }

    // 3. 發送 GET 請求至 GAS
    function saveToGoogleSheet(userId, langCode) {
      // ⚠️ 請在此處貼上您真正的 GAS 網頁應用程式網址 ⚠️
      const gasUrl = "https://docs.google.com/spreadsheets/d/12-L6mvyqV4plA_ETfGFBtptzld9nr6L6Vpg8Zvh0-TM/edit?gid=1547808919#gid=1547808919"; 
      
      // 修正參數名稱：改為 lineUserId 以對應後端
      const targetUrl = `${gasUrl}?lineUserId=${encodeURIComponent(userId)}&preferredLanguage=${encodeURIComponent(langCode)}`;

      fetch(targetUrl, {
        method: "GET",
        mode: "no-cors" // 解決跨網域 CORS 問題
      })
      .then(() => {
        // 成功後顯示提示，並於 3 秒後自動關閉 LIFF 視窗
        document.getElementById("status").innerText = "資料綁定成功！即將關閉視窗...";
        setTimeout(() => {
          liff.closeWindow();
        }, 3000);
      })
      .catch(err => {
        document.getElementById("status").innerText = "網路連線錯誤";
        console.error(err);
      });
    }
  </script>
</body>
</html>
